<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains">
      <string>Iosevka Nerd Font</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range>
            <int>0xe900</int>
            <int>0xea19</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
